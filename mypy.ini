[mypy]
python_version = 3.13
strict = True
show_error_codes = True
# Legacy import boundaries are intentionally dormant in modern-only consumers.
warn_unused_configs = False
files = fuzzyroutines/__init__.py,
    fuzzyroutines/alphacuts.py,
    fuzzyroutines/defuzzification.py,
    fuzzyroutines/domain.py,
    fuzzyroutines/encoding.py,
    fuzzyroutines/exceptions.py,
    fuzzyroutines/fuzzysets.py,
    fuzzyroutines/inference.py,
    fuzzyroutines/linguistic.py,
    fuzzyroutines/membership.py,
    fuzzyroutines/numeric.py,
    fuzzyroutines/operators.py,
    fuzzyroutines/presets.py,
    fuzzyroutines/properties.py,
    fuzzyroutines/relations.py,
    tests/typing/custom_membership.py,
    tests/typing/inference_consumer.py,
    tests/typing/modern_consumer.py,
    tests/typing/scale_consumer.py,
    tools/typecheck.py

# The NumPy module and its consumers join this strict scope only through
# tools.typecheck --extra numpy; the default gate needs no optional dependency.

# Historical mutable adapters have a runtime compatibility contract, not a
# modern typing contract. Modern modules and every consumer stay strict.
[mypy-fuzzyroutines.FuzzyRoutines,fuzzyroutines.Examples,fuzzyroutines._legacy,fuzzyroutines._legacy.*]
follow_imports = skip
