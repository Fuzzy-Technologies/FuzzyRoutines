site_name: FuzzyRoutines API evaluation
site_description: Reproducible API-documentation architecture spike for FuzzyRoutines.
site_url: https://fuzzy-technologies.github.io/FuzzyRoutines/api/
repo_url: https://github.com/Fuzzy-Technologies/FuzzyRoutines
repo_name: Fuzzy-Technologies/FuzzyRoutines
edit_uri: edit/develop/docs/api-evaluation/source/

docs_dir: source
site_dir: ../../_build/api-evaluation/mkdocstrings/site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: deep purple
  features:
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.suggest

nav:
  - Evaluation: index.md
  - API:
      - Fuzzy sets: api/fuzzysets.md
      - Domains: api/domain.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../..
          options:
            docstring_style: google
            heading_level: 2
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            separate_signature: true
            show_source: true
            signature_crossrefs: true

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/fuzzy-technologies.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

copyright: Technologies · Knowledge · Science
