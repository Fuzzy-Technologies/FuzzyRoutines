name: Documentation quality gates

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  deterministic-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements-api.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements-api.txt

      - name: Validate locale identity, reviews, and drift
        run: |
          python -m tools.locale_documentation validate \
            --project-root . \
            --output _build/documentation-gates/locales.json

      - name: Build the installed-package reference in strict mode
        run: |
          python tools/build_api_reference.py
          python tools/compose_pages_site.py

      - name: Upload disposable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-evidence
          path: _build
          if-no-files-found: error

      - name: Upload the official Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/pages/site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deterministic-documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      - name: Deploy the previously validated Pages artifact
        uses: actions/deploy-pages@v4
