[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyroutines"
version = "1.0.0"
description = "FuzzyRoutines library contains routines for fuzzy logic operators, fuzzy datasets and fuzzy scales."
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
authors = [
    {name = "Timur Gilmullin", email = "tim55667757@gmail.com"}
]
keywords = ["fuzzy", "logic", "math", "science", "research", "fuzzylogic", "fuzzyset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://fuzzy-technologies.github.io/"
Repository = "https://github.com/Fuzzy-Technologies/FuzzyRoutines"
Documentation = "https://fuzzy-technologies.github.io/FuzzyRoutines/"

[tool.setuptools]
packages = ["fuzzyroutines"]
