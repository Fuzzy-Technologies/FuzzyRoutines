[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyroutines"
version = "2.0.0.dev0"
description = "Routines for fuzzy logic operators, fuzzy datasets, and fuzzy scales."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Timur Gilmullin", email = "tim55667757@gmail.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
keywords = ["fuzzy", "fuzzylogic", "fuzzyset", "logic", "math", "research", "science"]

[project.urls]
Homepage = "https://github.com/Fuzzy-Technologies/FuzzyRoutines"
Repository = "https://github.com/Fuzzy-Technologies/FuzzyRoutines"
Issues = "https://github.com/Fuzzy-Technologies/FuzzyRoutines/issues"

[tool.setuptools.packages.find]
include = ["fuzzyroutines*"]

[tool.pytest.ini_options]
markers = [
  "serial: requires an exclusive shared resource and runs outside the parallel phase",
]

[tool.fuzzyroutines.test-runner]
max-workers = 12
timeout = 60
