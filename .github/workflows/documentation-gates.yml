name: Documentation quality gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-documentation:
    name: Coverage, strict build, links and installed examples
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs/requirements-api.txt
            docs/requirements-plots.txt

      - name: Select full or reviewed focused validation
        id: scope
        uses: ./.github/actions/ci-policy

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test documentation validators without network access
        run: |
          python -m pytest -q \
            tests/test_documentation_gates.py \
            tests/test_external_link_report.py \
            tests/test_locale_documentation.py \
            tests/test_guide_example_coverage.py \
            tests/test_guide_examples.py

      - name: Build strict reference from a clean installed wheel
        if: steps.scope.outputs.documentation == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python tools/build_api_reference.py
          python tools/compose_pages_site.py --locale-root _build/api-reference/locales --include-drafts --output _build/pages/review
          python tools/compose_pages_site.py --locale-root _build/api-reference/locales
          find _build/api-reference/site -type f -print | LC_ALL=C sort \
            > _build/api-reference/generated-files.txt

      - name: Enforce coverage, source links, rendered anchors and generated policy
        if: steps.scope.outputs.documentation == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _build/documentation-gates
          python -m tools.locale_documentation validate \
            --output _build/documentation-gates/locales.json
          python -m tools.documentation_gates all \
            --site-root _build/pages/review --deployment-path /FuzzyRoutines 2>&1 \
            | tee _build/documentation-gates/deterministic.txt
          python -m tools.documentation_gates rendered-links \
            --site-root _build/pages/site --deployment-path /FuzzyRoutines

      - name: Run documented examples against the clean installed wheel
        if: steps.scope.outputs.documentation == 'true'
        shell: bash
        run: |
          set -euo pipefail

          environmentPython="_build/api-reference/environment/bin/python"
          "$environmentPython" -m pip install --disable-pip-version-check pytest
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$environmentPython" -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_migration_examples.py" \
            "$GITHUB_WORKSPACE/tests/test_guide_examples.py"
          "$GITHUB_WORKSPACE/$environmentPython" -I "$GITHUB_WORKSPACE/tools/guide_example_coverage.py" \
            --require-installed --check-index \
            --output "$GITHUB_WORKSPACE/_build/documentation-gates/api-examples.json"

      - name: Verify reproducible figures with the installed scalar API
        if: steps.scope.outputs.documentation == 'true'
        shell: bash
        run: |
          set -euo pipefail

          environmentPython="_build/api-reference/environment/bin/python"
          "$environmentPython" -m pip install --disable-pip-version-check -r docs/requirements-plots.txt
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$environmentPython" -I -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_guide_figures.py" \
            "$GITHUB_WORKSPACE/tests/test_agent_recipe_plots.py" \
            "$GITHUB_WORKSPACE/tests/test_encoding_figure.py" \
            "$GITHUB_WORKSPACE/tests/test_inference_figures.py"
          "$GITHUB_WORKSPACE/$environmentPython" -I "$GITHUB_WORKSPACE/tools/generate_guide_figures.py" \
            --output-directory "$GITHUB_WORKSPACE/docs/site/content/en/assets/figures" --check \
            > "$GITHUB_WORKSPACE/_build/documentation-gates/figures.json"
          "$GITHUB_WORKSPACE/$environmentPython" -I "$GITHUB_WORKSPACE/tools/generate_encoding_figure.py" \
            --output-directory "$GITHUB_WORKSPACE/docs/site/content/en/assets/figures" --check \
            > "$GITHUB_WORKSPACE/_build/documentation-gates/encoding-figure.json"
          "$GITHUB_WORKSPACE/$environmentPython" -I "$GITHUB_WORKSPACE/tools/generate_inference_figures.py" \
            --output-directory "$GITHUB_WORKSPACE/docs/site/content/en/assets/figures" --check \
            > "$GITHUB_WORKSPACE/_build/documentation-gates/inference-figures.json"

      - name: Upload deterministic documentation evidence
        if: always() && steps.scope.outputs.documentation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-deterministic-evidence
          path: |
            _build/api-reference/build-evidence.json
            _build/api-reference/generated-files.txt
            _build/documentation-gates/deterministic.txt
            _build/documentation-gates/locales.json
            _build/documentation-gates/figures.json
            _build/documentation-gates/encoding-figure.json
            _build/documentation-gates/inference-figures.json
            _build/documentation-gates/api-examples.json
          if-no-files-found: warn

  external-link-report:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened'
    name: Non-blocking external-link health report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Select full or reviewed focused validation
        id: scope
        uses: ./.github/actions/ci-policy

      - name: Probe external documentation links
        continue-on-error: true
        run: |
          python tools/report_external_links.py \
            --output _build/documentation-gates/external-links.json \
            --timeout 10 \
            --workers 8

      - name: Upload external-link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-external-link-report
          path: _build/documentation-gates/external-links.json
          if-no-files-found: error
