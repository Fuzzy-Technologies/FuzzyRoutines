name: Optional vectorized prototype parity

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  array-parity:
    name: NumPy prototype parity on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            experiments/requirements-vectorized.txt
      - name: Install scalar tests and isolated experiment dependency
        run: python -m pip install -r requirements.txt -r experiments/requirements-vectorized.txt
      - name: Record runtime and optional dependency versions
        run: python -c "import sys, numpy; print(sys.version); print('NumPy', numpy.__version__)"
      - name: Check scalar parity and dependency isolation
        run: python -m pytest -q tests/test_vectorized_membership.py tests/test_vectorized_optional_boundary.py tests/test_benchmark_vectorized_membership.py
