name: Mathematical coverage and execution parity

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Python ${{ matrix.python }} module coverage and process parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Select full or reviewed focused validation
        id: scope
        uses: ./.github/actions/ci-policy

      - name: Install measurement dependencies
        run: python -m pip install -r requirements.txt coverage==7.16.2
      - name: Measure all library lines and branches sequentially
        if: steps.scope.outputs.full == 'true'
        run: |
          mkdir -p _build/math-audit
          python -m coverage run --branch --source=fuzzyroutines --omit=fuzzyroutines/Examples.py -m pytest -q --junitxml=_build/math-audit/sequential.xml
          python -m coverage report --show-missing
          python -m coverage json -o _build/math-audit/coverage.json
      - name: Verify actual process execution and per-test outcome parity
        if: steps.scope.outputs.full == 'true'
        run: |
          python -m tools.test_runner --jobs auto --timeout 60 --evidence-directory _build/math-audit/parallel
          python -m tools.release_test_audit \
            --coverage _build/math-audit/coverage.json \
            --serial _build/math-audit/sequential.xml \
            --parallel-directory _build/math-audit/parallel \
            --output _build/math-audit/release-test-audit.json
      - name: Run reviewed feature tests on routine updates
        if: steps.scope.outputs.full != 'true' && matrix.python == '3.14'
        run: python tools/ci_policy.py --run-tests
      - name: Verify supported-runtime imports on routine updates
        if: steps.scope.outputs.full != 'true' && matrix.python == '3.13'
        run: python -m pytest -q tests/test_legacy_import_compatibility.py tests/test_public_typing_runtime.py
      - name: Upload exact-revision evidence
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: math-audit-python-${{ matrix.python }}-${{ github.sha }}
          path: _build/math-audit
          if-no-files-found: error
