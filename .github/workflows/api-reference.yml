name: Canonical API reference

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    name: Python 3.14 installed-package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements-api.txt

      - name: Build strict API reference from installed wheel
        run: python tools/build_api_reference.py

      - name: Compose complete GitHub Pages site
        run: python tools/compose_pages_site.py --locale-root _build/api-reference/locales

      - name: Exercise static locale rendering boundaries
        run: |
          _build/api-reference/environment/bin/python -m pip install pytest
          _build/api-reference/environment/bin/python -m pytest -q tests/test_locale_reference.py

      - name: Compose explicitly labelled translation review preview
        run: >-
          python tools/compose_pages_site.py --locale-root _build/api-reference/locales
          --include-drafts --output _build/pages/review

      - name: Install pinned browser review dependencies
        timeout-minutes: 10
        run: |
          npm install --prefix _build/browser-dependencies --no-audit --no-fund --ignore-scripts playwright@1.62.1 mathjax@3.2.2
          _build/browser-dependencies/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Inspect desktop and mobile documentation in Chromium
        timeout-minutes: 5
        run: node tools/check_rendered_documentation.cjs

      - name: Upload rendered review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-documentation-review
          path: _build/browser-review
          if-no-files-found: warn

      - name: Record generated-file inventory
        shell: bash
        run: |
          set -euo pipefail

          find _build/api-reference/site -type f -print | LC_ALL=C sort \
            > _build/api-reference/generated-files.txt
          cat _build/api-reference/build-evidence.json
          cat _build/api-reference/generated-files.txt

      - name: Upload disposable build evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-api-reference
          path: |
            _build/api-reference/build-evidence.json
            _build/api-reference/generated-files.txt
            _build/api-reference/site
            _build/api-reference/locales/*/evidence.json
          if-no-files-found: error

      - name: Upload previewable Pages content
        uses: actions/upload-artifact@v4
        with:
          name: fuzzyroutines-pages-preview
          path: _build/pages/review
          if-no-files-found: error

      - name: Upload official Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/pages/site

  deploy-pages:
    name: Publish approved default-branch documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
