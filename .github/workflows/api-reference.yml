name: Canonical API reference

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reference:
    name: Python 3.14 installed-package documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements-api.txt

      - name: Select full or reviewed focused validation
        id: scope
        uses: ./.github/actions/ci-policy

      - name: Check API discovery contracts on routine code updates
        if: steps.scope.outputs.documentation != 'true'
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_api_reference.py tests/test_public_api_documentation.py tests/test_locale_reference.py

      - name: Build strict API reference from installed wheel
        if: steps.scope.outputs.documentation == 'true'
        run: python tools/build_api_reference.py

      - name: Compose complete GitHub Pages site
        if: steps.scope.outputs.documentation == 'true'
        run: python tools/compose_pages_site.py --locale-root _build/api-reference/locales

      - name: Exercise static locale rendering boundaries
        if: steps.scope.outputs.documentation == 'true'
        run: |
          _build/api-reference/environment/bin/python -m pip install pytest
          _build/api-reference/environment/bin/python -m pytest -q tests/test_locale_reference.py

      - name: Compose explicitly labelled translation review preview
        if: steps.scope.outputs.documentation == 'true'
        run: >-
          python tools/compose_pages_site.py --locale-root _build/api-reference/locales
          --include-drafts --output _build/pages/review

      - name: Install pinned browser review tooling
        if: steps.scope.outputs.documentation == 'true'
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 90s npm install --prefix _build/browser-dependencies \
            --registry=https://registry.npmjs.org --no-audit --no-fund --ignore-scripts \
            playwright@1.62.1 mathjax@3.2.2

      - name: Install Chromium system dependencies and CJK fonts
        if: steps.scope.outputs.documentation == 'true'
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail

          playwright="$PWD/_build/browser-dependencies/node_modules/.bin/playwright"
          sourcesFile=/etc/apt/fuzzyroutines-browser.sources
          aptConfig=/etc/apt/apt.conf.d/99fuzzyroutines-browser
          sudo -n test ! -e "$sourcesFile"
          sudo -n test ! -e "$aptConfig"
          trap 'sudo -n rm -f -- "$aptConfig" "$sourcesFile"' EXIT

          # Playwright runs APT through sudo, so use an override only for this step.
          sudo -n tee "$aptConfig" >/dev/null <<'APT'
          Dir::Etc::sourcelist "/etc/apt/fuzzyroutines-browser.sources";
          Dir::Etc::sourceparts "-";
          Acquire::Retries "1";
          Acquire::https::Timeout "20";
          APT::Update::Error-Mode "any";
          DPkg::Lock::Timeout "5";
          APT

          InstallFromArchive() {
            local archive=$1
            printf 'Installing browser system dependencies from %s\n' "$archive"
            sudo -n tee "$sourcesFile" >/dev/null <<APT || return
          Types: deb
          URIs: $archive
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT

            timeout --kill-after=5s 150s bash -euo pipefail -c '
              "$1" install-deps chromium
              sudo -n apt-get install -y --no-install-recommends "$2"
            ' -- "$playwright" 'fonts-noto-cjk=1:20230817+repack1-3'
          }

          if ! InstallFromArchive https://archive.ubuntu.com/ubuntu; then
            audit=$(sudo -n dpkg --audit)
            if [[ -n "$audit" ]]; then
              printf '%s\n' "$audit" >&2
              exit 1
            fi

            InstallFromArchive https://us.archive.ubuntu.com/ubuntu
          fi

      - name: Install pinned Chromium headless shell
        if: steps.scope.outputs.documentation == 'true'
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 90s \
            _build/browser-dependencies/node_modules/.bin/playwright install --only-shell chromium

      - name: Inspect desktop and mobile documentation in Chromium
        if: steps.scope.outputs.documentation == 'true'
        timeout-minutes: 5
        run: node tools/check_rendered_documentation.cjs

      - name: Upload rendered review evidence
        if: always() && steps.scope.outputs.documentation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-documentation-review
          path: _build/browser-review
          if-no-files-found: warn

      - name: Record generated-file inventory
        if: steps.scope.outputs.documentation == 'true'
        shell: bash
        run: |
          set -euo pipefail

          find _build/api-reference/site -type f -print | LC_ALL=C sort \
            > _build/api-reference/generated-files.txt
          cat _build/api-reference/build-evidence.json
          cat _build/api-reference/generated-files.txt

      - name: Upload disposable build evidence
        if: steps.scope.outputs.documentation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-api-reference
          path: |
            _build/api-reference/build-evidence.json
            _build/api-reference/generated-files.txt
            _build/api-reference/site
            _build/api-reference/locales/*/evidence.json
          if-no-files-found: error

      - name: Upload previewable Pages content
        if: steps.scope.outputs.documentation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzzyroutines-pages-preview
          path: _build/pages/review
          if-no-files-found: error

      - name: Upload official Pages artifact
        if: steps.scope.outputs.documentation == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/pages/site

  deploy-pages:
    name: Publish approved default-branch documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
