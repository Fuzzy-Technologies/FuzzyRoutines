name: Legacy test baseline

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/legacy-test-baseline.yml"
      - "docs/baseline/legacy-test-matrix.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-suite:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.6"
            image: "python:3.6-slim"
          - python: "3.8"
            image: "python:3.8-slim"
          - python: "3.11"
            image: "python:3.11-slim"
          - python: "3.13"
            image: "python:3.13-slim"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize immutable legacy source
        shell: bash
        run: |
          set -euo pipefail

          legacySnapshot="$RUNNER_TEMP/fuzzyroutines-legacy"
          mkdir -p "$legacySnapshot"
          git archive 8e739c1665aa9894ede556e3f3f4cb20174d14ff | tar -x -C "$legacySnapshot"
          echo "LEGACY_SNAPSHOT=$legacySnapshot" >> "$GITHUB_ENV"

      - name: Run unmodified legacy suite
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm             -v "$LEGACY_SNAPSHOT:/work"             -w /work             "$PYTHON_IMAGE"             sh -lc '
              set -eu
              python --version
              python -m pip --version
              python -m pip install --disable-pip-version-check --no-cache-dir pytest
              python -m pytest -q tests/test_routines.py
            '
