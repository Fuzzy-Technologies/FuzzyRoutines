name: Legacy coverage baseline

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/legacy-coverage-baseline.yml"
      - "docs/baseline/legacy-coverage.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install measurement dependencies
        run: python -m pip install --disable-pip-version-check pytest coverage

      - name: Measure unmodified legacy suite
        run: |
          python -m coverage run --branch -m pytest -q tests/test_routines.py
          python -m coverage report --show-missing
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json

          report = json.load(open("coverage.json", encoding="utf-8"))
          print("COVERAGE_TOTALS", json.dumps(report["totals"], sort_keys=True))
          print("FUZZYROUTINES_SOURCE", json.dumps(report["files"]["fuzzyroutines/FuzzyRoutines.py"]["summary"], sort_keys=True))
          PY

      - name: Upload machine-readable coverage
        uses: actions/upload-artifact@v4
        with:
          name: legacy-coverage-json
          path: coverage.json
          if-no-files-found: error
