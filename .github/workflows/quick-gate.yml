name: Quick deterministic gate

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-gate:
    name: Python 3.14 tests and import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Select full or reviewed focused validation
        id: scope
        uses: ./.github/actions/ci-policy

      - name: Show environment
        run: |
          python --version
          python -m pip --version

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Validate Apache-2.0 headers and metadata
        run: python -m tools.check_license_headers

      - name: Validate the CI selection and source contracts
        run: python -m pytest -q tests/test_ci_policy.py tests/test_python_naming.py tests/test_python_source_layout.py

      - name: Run legacy import smoke
        run: |
          python - <<'PY'
          import fuzzyroutines.FuzzyRoutines as routines

          print("Imported:", routines.__file__)
          PY
