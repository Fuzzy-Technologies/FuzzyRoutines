name: Quick deterministic gate

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  quick-gate:
    name: Python 3.14 tests and import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show environment
        run: |
          python --version
          python -m pip --version

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Run legacy test suite
        run: python -m pytest -q

      - name: Run legacy import smoke
        run: |
          python - <<'PY'
          import fuzzyroutines.FuzzyRoutines as routines

          print("Imported:", routines.__file__)
          PY
